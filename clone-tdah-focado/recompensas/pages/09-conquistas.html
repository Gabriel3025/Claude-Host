<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAH Focado Kids - Conquistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    @page { size: A4; margin: 0.5cm; }
    h1 { font-size: 24px; color: var(--color-text-dark); margin-bottom: 8mm; text-align: center; }
    .medals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8mm; margin-bottom: 10mm; margin-top: 10mm; }
    .medal { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .medal-circle { width: 50mm; height: 50mm; border: 4px solid var(--color-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 6mm; background-color: rgba(255, 140, 0, 0.05); }
    .medal-label { font-size: 14px; font-weight: 700; color: var(--color-text-dark); margin-bottom: 4mm; }
    .medal-date { font-size: 11px; color: var(--color-text); margin-bottom: 2mm; }
    .medal-input { border-bottom: 2px dotted var(--color-border); width: 60mm; padding: 2mm 0; text-align: center; font-size: 11px; }
    .instruction { font-size: 12px; color: var(--color-text); text-align: center; margin-bottom: 8mm; background-color: rgba(78, 205, 196, 0.08); padding: 6mm; border-radius: 6px; }
    .achievement-section { border: 2px solid var(--color-accent); border-radius: 6px; padding: 8mm; margin-top: 10mm; background-color: rgba(78, 205, 196, 0.05); }
    .achievement-title { font-size: 13px; font-weight: 600; color: var(--color-accent); margin-bottom: 6mm; }
    .achievement-text { border-bottom: 1px dotted var(--color-border); width: 100%; padding: 4mm 0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🏅 Meu Quadro de Conquistas</h1>

  <div class="instruction">
    Quando você atingir os marcos de pontos, pinte ou cole um adesivo na medalha correspondente! 🎉
  </div>

  <div class="medals-grid">
    <div class="medal">
      <div class="medal-circle">10</div>
      <div class="medal-label">10 Pontos!</div>
      <div class="medal-date">Atingi em:</div>
      <input type="text" class="medal-input" placeholder="">
    </div>

    <div class="medal">
      <div class="medal-circle">25</div>
      <div class="medal-label">25 Pontos!</div>
      <div class="medal-date">Atingi em:</div>
      <input type="text" class="medal-input" placeholder="">
    </div>

    <div class="medal">
      <div class="medal-circle">50</div>
      <div class="medal-label">50 Pontos!</div>
      <div class="medal-date">Atingi em:</div>
      <input type="text" class="medal-input" placeholder="">
    </div>

    <div class="medal">
      <div class="medal-circle">100</div>
      <div class="medal-label">100 Pontos!</div>
      <div class="medal-date">Atingi em:</div>
      <input type="text" class="medal-input" placeholder="">
    </div>
  </div>

  <div class="achievement-section">
    <div class="achievement-title">⭐ Minha Maior Conquista do Mês</div>
    <input type="text" class="achievement-text" placeholder="">
  </div>
</body>
</html>
