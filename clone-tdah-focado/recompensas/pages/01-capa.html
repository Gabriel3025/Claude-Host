<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAH Focado Kids - Sistema de Recompensas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    @page { size: A4; margin: 0.5cm; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 297mm;
      background: linear-gradient(to bottom, #FFF8ED, #FFE4B5);
    }
    .cover-content {
      text-align: center;
      width: 100%;
    }
    .cover-illustration {
      font-size: 80px;
      margin: 20mm 0;
    }
    .cover-logo {
      font-size: 48px;
      font-weight: 800;
      color: var(--color-text-dark);
      margin-bottom: 10mm;
    }
    .cover-tagline {
      font-size: 16px;
      color: var(--color-accent);
      font-weight: 600;
      margin-bottom: 15mm;
    }
    .cover-benefits {
      margin: 15mm 0;
      font-size: 13px;
      color: var(--color-text);
    }
    .benefit-item {
      margin: 6mm 0;
    }
    .cover-name-field {
      margin-top: 20mm;
      font-size: 12px;
    }
    .name-input {
      border-bottom: 2px dotted var(--color-border);
      width: 150mm;
      padding: 4mm 0;
      text-align: center;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <div class="cover-content">
    <div class="cover-illustration">🏆 ⭐ 🎁</div>

    <div class="cover-logo">TDAH Focado Kids</div>

    <div class="cover-tagline">Meu Sistema de Recompensas!</div>

    <div class="separator"></div>

    <div class="cover-benefits">
      <div class="benefit-item">🤝 Comprometer-se com metas</div>
      <div class="benefit-item">⭐ Ganhar pontos todos os dias</div>
      <div class="benefit-item">🏅 Celebrar conquistas</div>
      <div class="benefit-item">🎁 Conquistar prêmios!</div>
    </div>

    <div class="cover-name-field">
      <div style="margin-bottom: 4mm;">Meu nome:</div>
      <input type="text" class="name-input" placeholder="__________________________">
    </div>
  </div>
</body>
</html>
