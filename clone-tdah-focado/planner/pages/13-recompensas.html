<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAH Focado Kids - Recompensas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    @page { size: A4; margin: 0.5cm; }
    h1 { font-size: 24px; color: var(--color-text-dark); margin-bottom: 6mm; }
    .instruction { font-size: 12px; color: var(--color-text); margin-bottom: 10mm; }
    .legend { display: grid; grid-template-columns: auto 1fr; gap: 8mm; margin-bottom: 12mm; font-size: 11px; }
    .legend-item { display: flex; align-items: center; }
    .legend-emoji { font-size: 18px; min-width: 20px; }
    .reward-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-bottom: 12mm; }
    .reward-box { aspect-ratio: 1.4; border: 2px solid var(--color-border); border-radius: 4px; background-color: white; }
    .completion { text-align: center; font-size: 13px; font-weight: 600; color: var(--color-text-dark); margin-bottom: 8mm; padding: 6mm; background-color: rgba(255, 179, 103, 0.1); border-radius: 6px; }
    .celebration { font-size: 28px; margin-bottom: 6mm; }
    .message { font-size: 12px; color: var(--color-text); line-height: 1.8; }
  </style>
</head>
<body>
  <h1>🎉 Quadro de Recompensas</h1>

  <div class="instruction">Cole um adesivo a cada tarefa importante concluída!</div>

  <div class="legend">
    <div class="legend-item"><span class="legend-emoji">⭐</span><span>= Tarefa importante</span></div>
    <div class="legend-item"><span class="legend-emoji">🌟</span><span>= Meta do mês</span></div>
    <div class="legend-item"><span class="legend-emoji">✨</span><span>= Superou expectativas!</span></div>
  </div>

  <div class="separator"></div>

  <div class="reward-grid">
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>

    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>

    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>

    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>

    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
    <div class="reward-box"></div>
  </div>

  <div class="separator"></div>

  <div class="completion">
    <div class="celebration">🏆 30 adesivos = Você é INCRÍVEL! 🏆</div>
    <div class="message">Parabéns por sua dedicação e foco!</div>
  </div>
</body>
</html>
