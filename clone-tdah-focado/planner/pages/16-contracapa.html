<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAH Focado Kids - Contracapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    @page { size: A4; margin: 0.5cm; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 297mm;
      background: linear-gradient(to bottom, #FFF8ED, #F0E68C);
    }
    .cover-content {
      text-align: center;
      width: 100%;
    }
    .logo { font-size: 48px; margin-bottom: 15mm; }
    .brand-name { font-size: 32px; font-weight: 800; color: var(--color-text-dark); margin-bottom: 10mm; }
    .tagline { font-size: 16px; color: var(--color-accent); font-weight: 600; margin-bottom: 20mm; }
    .separator { width: 100mm; height: 2px; background-color: var(--color-border); margin: 15mm auto; }
    .contact-section { margin: 15mm 0; font-size: 12px; color: var(--color-text); }
    .contact-item { margin: 4mm 0; }
    .credit { font-size: 11px; color: var(--color-text); margin-top: 20mm; line-height: 1.6; }
    .credit-emphasis { color: var(--color-accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="cover-content">
    <div class="logo">📚</div>

    <div class="brand-name">TDAH Focado Kids</div>

    <div class="tagline">Seu Planner Semanal para Ficar Focado!</div>

    <div class="separator"></div>

    <div class="credit">
      <p>Desenvolvido com <span class="credit-emphasis">💙</span> para</p>
      <p>crianças e adolescentes com TDAH</p>
    </div>

    <div style="margin-top: 20mm; font-size: 13px; color: var(--color-accent); font-weight: 600;">
      Designed for Focus, Built for Success <span style="color: #FFD700;">⭐</span>
    </div>
  </div>
</body>
</html>
