<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAH Focado Kids - Mensagem Especial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    @page { size: A4; margin: 0.5cm; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 297mm;
      background: linear-gradient(135deg, #FF8C00, #FFB347);
    }
    .message-container {
      text-align: center;
      color: white;
      width: 100%;
      padding: 20mm;
    }
    .stars { font-size: 32px; margin-bottom: 15mm; }
    .main-message { font-size: 32px; font-weight: 800; margin-bottom: 15mm; line-height: 1.4; }
    .secondary-message { font-size: 18px; font-weight: 600; margin-bottom: 20mm; line-height: 1.6; }
    .emphasis { color: #FFD700; text-decoration: underline; }
    .decoration { font-size: 24px; margin-top: 15mm; }
  </style>
</head>
<body>
  <div class="message-container">
    <div class="stars">⭐  ✨  ⭐</div>

    <div class="main-message">Você é<br>INCRÍVEL! 🌟</div>

    <div class="secondary-message">
      Cada dia que você se esforça,<br>
      seu cérebro fica <span class="emphasis">mais forte</span>.<br>
      <br>
      Parabéns por ser <span class="emphasis">FOCADO!</span><br>
      <br>
      Você consegue tudo o que deseja!
    </div>

    <div class="decoration">
      💙  ✨  💙<br>
      ⭐  ⭐  ⭐
    </div>
  </div>
</body>
</html>
