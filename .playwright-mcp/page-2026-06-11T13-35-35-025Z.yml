      - generic [ref=e14]:
        - paragraph [ref=e15]: Quando uma criança com TDAH começa a ter notas baixas, esquece a lição em casa ou não consegue ficar quieta na sala, a primeira reação de muitos pais é cobrar mais disciplina. Mas estudos da Academia mostram que crianças com TDAH não escolhem desatenção — o cérebro delas processa informação de forma diferente.
        - paragraph [ref=e16]: O TDAH (Transtorno de Déficit de Atenção e Hiperatividade) afeta funções executivas como organização, memória de trabalho, controle de impulsos e gerenciamento de tempo. Tudo isso é exigido o tempo inteiro na escola.
